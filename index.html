<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCS - Checkout Dashboard</title>
    <link rel="icon" href="images/favicon-catalogue.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <div class="brand">
            <span class="font-bem">BEM</span>
            <span class="font-rock">On The Rock</span>
            <span class="app-title">| Checkout Dashboard</span>
        </div>
        <div class="nav-controls">
            <a href="catalogue.html" class="nav-link">📦 Catalogue</a>
            <a href="sales.html" class="nav-link">📊 Sales</a>
            <button id="theme-toggle" class="btn-outline">🌙 Dark Mode</button>
        </div>
    </header>

    <main class="checkout-layout">

        <!-- LEFT: Item Selection (65%) -->
        <section class="selection-panel">
            <h2>Log a Sale</h2>

            <div class="form-group">
                <label>Select Item</label>
                <!-- Category tab bar — populated dynamically from Firestore -->
                <div id="checkout-tab-bar" class="tab-bar hidden"></div>
                <div id="product-grid" class="product-grid">
                    <p class="grid-loading">Loading inventory...</p>
                </div>
            </div>

            <div class="form-group hidden" id="variant-group">
                <label>Select Variation</label>
                <div id="variant-grid" class="variant-grid"></div>
            </div>

            <div class="form-group hidden" id="quantity-group">
                <label for="quantity">Quantity</label>
                <div class="quantity-row">
                    <button type="button" id="qty-minus" class="qty-btn">−</button>
                    <input type="number" id="quantity" min="1" value="1">
                    <button type="button" id="qty-plus" class="qty-btn">+</button>
                </div>
                <p class="stock-hint" id="stock-hint"></p>
            </div>

            <button type="button" id="add-to-cart-btn" class="btn-add-cart hidden">
                + Add to Cart
            </button>
        </section>

        <!-- RIGHT: Cart (35%) -->
        <aside class="cart-panel">
            <div class="cart-header">
                <h2>🛒 Cart</h2>
                <button id="clear-cart-btn" class="btn-clear-cart hidden">Clear All</button>
            </div>

            <div id="cart-items" class="cart-items">
                <p class="cart-empty">No items added yet.</p>
            </div>

            <div class="cart-footer">
                <div class="grand-total-row">
                    <span>Grand Total</span>
                    <span id="grand-total" class="grand-total-value">RM 0.00</span>
                </div>

                <div class="form-group">
                    <label>Payment Method</label>
                    <div class="payment-grid">
                        <label class="payment-option">
                            <input type="radio" name="payment" value="Cash" checked>
                            <span class="payment-btn">Cash</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="payment" value="Credit">
                            <span class="payment-btn">Credit/Debit</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="payment" value="Online Banking">
                            <span class="payment-btn">Online Transfer</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="payment" value="QR DuitNow">
                            <span class="payment-btn">QR DuitNow</span>
                        </label>
                    </div>
                </div>

                <button type="button" id="complete-btn" class="btn-primary" disabled>
                    Complete Transaction
                </button>
            </div>
        </aside>

    </main>

    <div id="toast-container"></div>
    <script type="module" src="app.js"></script>
</body>
</html>
