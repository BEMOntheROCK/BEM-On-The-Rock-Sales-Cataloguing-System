<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCS - Checkout Dashboard</title>
    <link rel="icon" href="images/favicon-catalogue.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <div class="brand">
            <span class="font-bem">BEM</span> 
            <span class="font-rock">On The Rock</span>
            <span class="app-title">| Checkout Dashboard</span>
        </div>
        <div class="nav-controls">
            <a href="catalogue.html" class="nav-link">📦 Catalogue</a>
            <a href="sales.html" class="nav-link">📊 Sales</a>
            <button id="theme-toggle" class="btn-outline">🌙 Dark Mode</button>
        </div>
    </header>

    <main class="container">
        <section class="checkout-panel">
            <h2>Log a Sale</h2>
            
            <form id="checkout-form">

                <!-- STEP 1: Product card grid -->
                <div class="form-group">
                    <label>Select Item</label>
                    <div id="product-grid" class="product-grid">
                        <p class="grid-loading">Loading inventory...</p>
                    </div>
                </div>

                <!-- STEP 2: Variant selector — shown only when selected product has multiple variants -->
                <div class="form-group hidden" id="variant-group">
                    <label>Select Variation</label>
                    <div id="variant-grid" class="variant-grid"></div>
                </div>

                <!-- STEP 3: Quantity + Total — shown after item (and variant if needed) is selected -->
                <div id="quantity-group" class="hidden">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="quantity">Quantity</label>
                            <input type="number" id="quantity" min="1" value="1" required>
                        </div>
                        <div class="form-group">
                            <label>Total Price (RM)</label>
                            <div class="total-display" id="total-price">0.00</div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Payment Method</label>
                        <div class="payment-grid">
                            <label class="payment-option">
                                <input type="radio" name="payment" value="Cash" checked>
                                <span class="payment-btn">Cash</span>
                            </label>
                            <label class="payment-option">
                                <input type="radio" name="payment" value="Credit">
                                <span class="payment-btn">Credit/Debit</span>
                            </label>
                            <label class="payment-option">
                                <input type="radio" name="payment" value="Online Banking">
                                <span class="payment-btn">Online Transfer</span>
                            </label>
                            <label class="payment-option">
                                <input type="radio" name="payment" value="QR DuitNow">
                                <span class="payment-btn">QR DuitNow</span>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">Complete Transaction</button>
                </div>

            </form>
        </section>
    </main>

    <div id="toast-container"></div>
    <script type="module" src="app.js"></script>
</body>
</html>
