<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCS - Catalogue Manager</title>
    <link rel="icon" href="images/favicon-catalogue.png" type="image/png">
    <link rel="stylesheet" href="catalogue.css">
</head>
<body>
    <header class="navbar">
        <div class="brand">
            <span class="font-bem">BEM</span> 
            <span class="font-rock">On The Rock</span>
            <span class="app-title">| Catalogue Manager</span>
        </div>
        <div class="nav-controls">
            <a href="index.html" class="nav-link">← Back to Checkout</a>
            <button id="theme-toggle" class="btn-outline">🌙 Dark Mode</button>
        </div>
    </header>

    <main class="container">
        <section class="admin-panel form-section">
            <h2>Add New Product</h2>
            <form id="product-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="product-name">Product Name</label>
                        <input type="text" id="product-name" placeholder="e.g., Church Anniversary T-Shirt" required>
                    </div>
                    <div class="form-group">
                        <label for="product-price">Unit Price (RM)</label>
                        <input type="number" id="product-price" step="0.01" placeholder="35.00" required>
                    </div>
                </div>

                <!-- IMAGE UPLOAD -->
                <div class="form-group">
                    <label for="product-image">Product Image <span class="helper-text" style="display:inline;">(max 6MB — will be compressed automatically)</span></label>
                    <div class="image-upload-area" id="image-upload-area">
                        <input type="file" id="product-image" accept="image/*" hidden>
                        <div class="image-placeholder" id="image-placeholder">
                            <span class="upload-icon">📷</span>
                            <span>Click to upload image</span>
                        </div>
                        <img id="image-preview" class="image-preview hidden" alt="Product preview">
                        <button type="button" id="remove-image-btn" class="btn-remove-image hidden">✕ Remove</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Product Variations & Stock Levels</label>
                    <p class="helper-text">Specify the size, colour, or type, and how many are currently in stock.</p>
                    
                    <div id="variations-container">
                        <div class="variation-row">
                            <input type="text" class="var-name" placeholder="e.g., Size S - Black" required>
                            <input type="number" class="var-stock" placeholder="Stock Qty" min="0" required>
                            <button type="button" class="btn-icon delete-var" disabled>🗑️</button>
                        </div>
                    </div>
                    
                    <button type="button" id="add-variation-btn" class="btn-outline add-btn">+ Add Another Variation</button>
                </div>

                <button type="submit" class="btn-primary">Save to Catalogue</button>
            </form>
        </section>

        <section class="admin-panel table-section">
            <h2>Current Inventory</h2>
            <div class="table-responsive">
                <table id="inventory-table">
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Product Name</th>
                            <th>Price (RM)</th>
                            <th>Variations & Stock</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module" src="catalogue.js"></script>
</body>
</html>
